
<div class="container user-container">

    <div class="user-card">

        <!-- Profile picture -->
        <div class="user-image">
            <img [src]="userData.profilePic"
                 [alt]="userData.picTitle">
        </div>

        <!-- User information -->
        <div class="user-info">
            <h1>{{ userData.myName }}</h1>
            <h3 class="txt-secondary">{{ userData.qualification }}</h3>

            <p class="user-description">
                {{ userData.myIntro }}
            </p>
        </div>

    </div>

</div>
